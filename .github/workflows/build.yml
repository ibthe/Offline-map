name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      osm_url:
        description: "Optional: direct link to a .osm.pbf of Georgia (country) if automatic download fails"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Tiles (30-60 min) are cached on the OSM/tile tools only. The search index and relief have their own
      # exact-key caches: changing build_places.py rebuilds just places.db (fast) from the cached tiles.
      # (Before, restore-keys silently restored an OLD places.db, so edits to the index never applied.)
      - name: Cache tiles
        id: cache_tiles
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/georgia.mbtiles
          key: tiles-v1-${{ hashFiles('tools/fetch_osm.py', 'tools/finalize_tiles.py', 'tools/check_tiles.py', 'tools/mvt.py') }}
          restore-keys: |
            tiles-v1-

      - name: Cache search index
        id: cache_places
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/places.db
          key: places-v1-${{ hashFiles('tools/build_places.py', 'tools/mvt.py', 'tools/fetch_osm.py', 'tools/finalize_tiles.py') }}

      - name: Cache relief
        id: cache_relief
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/relief.mbtiles
          key: relief-v1-${{ hashFiles('tools/build_relief.py') }}

      # decided once, before anything is built (a file check per step would change mid-run)
      - name: Decide what has to be rebuilt
        id: need
        run: |
          mkdir -p app/src/main/assets
          [ -s app/src/main/assets/georgia.mbtiles ] || echo "tiles=true" >> "$GITHUB_OUTPUT"
          # places.db is exact-key cached: a miss (tool changed) or missing tiles means rebuild
          [ "${{ steps.cache_places.outputs.cache-hit }}" = "true" ] && [ -s app/src/main/assets/places.db ] || echo "places=true" >> "$GITHUB_OUTPUT"
          [ -s app/src/main/assets/relief.mbtiles ] || echo "relief=true" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
          ls -lh app/src/main/assets || true

      - name: Download OSM extract of Georgia (Geofabrik)
        if: steps.need.outputs.tiles == 'true'
        env:
          OSM_URL: ${{ github.event.inputs.osm_url }}
        run: |
          mkdir -p data
          python tools/fetch_osm.py data/georgia.osm.pbf
          ls -lh data/georgia.osm.pbf

      - name: Build vector tiles with Planetiler (OpenMapTiles schema)
        if: steps.need.outputs.tiles == 'true'
        run: |
          curl -L --fail --retry 3 -o data/planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar
          mkdir -p app/src/main/assets
          java -Xmx4g -jar data/planetiler.jar \
            --osm-path=data/georgia.osm.pbf \
            --download \
            --output=app/src/main/assets/georgia.mbtiles \
            --force \
            --maxzoom=14
          ls -lh app/src/main/assets/georgia.mbtiles

      - name: Normalize MBTiles and verify tile content (layers, ka/ru/en names)
        if: steps.need.outputs.tiles == 'true'
        working-directory: tools
        run: |
          python finalize_tiles.py ../app/src/main/assets/georgia.mbtiles
          python check_tiles.py ../app/src/main/assets/georgia.mbtiles

      - name: Build offline search index
        if: steps.need.outputs.places == 'true'
        working-directory: tools
        run: python build_places.py ../app/src/main/assets/georgia.mbtiles ../app/src/main/assets/places.db

      - name: Build relief tiles (hillshade + elevation readout)
        if: steps.need.outputs.relief == 'true'
        continue-on-error: true
        working-directory: tools
        run: python build_relief.py ../app/src/main/assets/relief.mbtiles

      - name: Build label fonts (Latin + Cyrillic + Georgian)
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq fonts-noto-core fonts-dejavu-core || true
          python -m pip install --quiet pillow numpy scipy fonttools
          rm -rf app/src/main/assets/glyphs
          python tools/build_glyphs.py app/src/main/assets/glyphs/NotoSans

      - name: Generate map style
        run: |
          python tools/gen_style.py app/src/main/assets/style.json
          python tools/gen_style.py app/src/main/assets/style_dark.json --dark

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle --no-daemon -Pvcode=${{ github.run_number }} :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: georgia-offline-map-apk
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0
