name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      osm_url:
        description: "Optional: direct link to a .osm.pbf of Georgia (country) if automatic download fails"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve pinned Planetiler release
        id: planetiler
        run: |
          version=$(curl -fsSL --retry 3 https://api.github.com/repos/onthegomap/planetiler/releases/latest | python -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Fingerprint the requested OSM source
        id: source
        env:
          OSM_URL: ${{ github.event.inputs.osm_url }}
        run: |
          mkdir -p data
          echo "osm_fingerprint=$(printf '%s' "$OSM_URL" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache source OSM extract
        id: cache_osm
        uses: actions/cache@v4
        with:
          path: data/georgia.osm.pbf
          key: osm-v1-${{ steps.source.outputs.osm_fingerprint }}-${{ hashFiles('tools/osm_data_revision.txt', 'tools/fetch_osm.py') }}

      # Reuse only exact, validated assets. Bump tools/osm_data_revision.txt or tools/terrain_data_revision.txt when intentionally refreshing
      # the corresponding upstream data snapshot. An explicit osm_url also gets its own cache namespace.
      - name: Cache tiles
        id: cache_tiles
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/georgia.mbtiles
          key: tiles-v2-${{ steps.planetiler.outputs.version }}-${{ steps.source.outputs.osm_fingerprint }}-${{ hashFiles('tools/osm_data_revision.txt', 'tools/fetch_osm.py', 'tools/finalize_tiles.py', 'tools/check_tiles.py', 'tools/mvt.py') }}

      - name: Cache search index
        id: cache_places
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/places.db
          key: places-v2-${{ steps.source.outputs.osm_fingerprint }}-${{ hashFiles('tools/osm_data_revision.txt', 'tools/build_places.py', 'tools/mvt.py', 'tools/fetch_osm.py', 'tools/finalize_tiles.py') }}

      - name: Cache relief
        id: cache_relief
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/relief.mbtiles
          key: relief-v2-${{ hashFiles('tools/terrain_data_revision.txt', 'tools/build_relief.py') }}

      - name: Cache contour lines
        id: cache_contours
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/contours.mbtiles
          key: contours-v2-${{ steps.source.outputs.osm_fingerprint }}-${{ hashFiles('tools/osm_data_revision.txt', 'tools/terrain_data_revision.txt', 'tools/finalize_tiles.py', 'tools/check_tiles.py', 'tools/mvt.py', 'tools/build_contours.py', 'tools/build_relief.py') }}

      - name: Cache road graph (navigator)
        id: cache_routing
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/routing.bin
          key: routing-v2-${{ steps.source.outputs.osm_fingerprint }}-${{ hashFiles('tools/osm_data_revision.txt', 'tools/build_routing.py', 'tools/fetch_osm.py') }}

      # Validate each cache independently. Only rebuild dependent assets when their input changed.
      - name: Decide what has to be rebuilt
        id: need
        run: |
          mkdir -p app/src/main/assets

          tiles_ok=false
          places_ok=false
          relief_ok=false
          contours_ok=false
          routing_ok=false
          osm_ok=false

          if [ "${{ steps.cache_osm.outputs.cache-hit }}" = "true" ] &&
             python tools/check_cached_assets.py osm data/georgia.osm.pbf; then
            osm_ok=true
          fi
          if [ "${{ steps.cache_tiles.outputs.cache-hit }}" = "true" ] && [ -s app/src/main/assets/georgia.mbtiles ] &&
             python tools/check_tiles.py app/src/main/assets/georgia.mbtiles >/dev/null; then
            tiles_ok=true
          fi
          if [ "${{ steps.cache_places.outputs.cache-hit }}" = "true" ] &&
             python tools/check_cached_assets.py places app/src/main/assets/places.db; then
            places_ok=true
          fi
          if [ "${{ steps.cache_relief.outputs.cache-hit }}" = "true" ] &&
             python tools/check_cached_assets.py relief app/src/main/assets/relief.mbtiles; then
            relief_ok=true
          fi
          if [ "${{ steps.cache_contours.outputs.cache-hit }}" = "true" ] &&
             python tools/check_cached_assets.py contours app/src/main/assets/contours.mbtiles; then
            contours_ok=true
          fi
          if [ "${{ steps.cache_routing.outputs.cache-hit }}" = "true" ] &&
             python tools/check_cached_assets.py routing app/src/main/assets/routing.bin; then
            routing_ok=true
          fi

          need_tiles=false
          need_places=false
          need_relief=false
          need_contours=false
          need_routing=false
          need_osm=false

          [ "$tiles_ok" = true ] || { need_tiles=true; need_places=true; need_contours=true; }
          [ "$places_ok" = true ] || need_places=true
          [ "$relief_ok" = true ] || { need_relief=true; need_contours=true; }
          [ "$contours_ok" = true ] || need_contours=true
          [ "$routing_ok" = true ] || need_routing=true

          # If the exact source PBF was evicted or invalid, rebuild every OSM-derived asset from
          # one newly downloaded extract so the tiles, search index and routing graph stay aligned.
          if [ "$osm_ok" != true ] && { [ "$need_tiles" = true ] || [ "$need_routing" = true ]; }; then
            need_osm=true
            need_tiles=true
            need_routing=true
            need_places=true
            need_contours=true
          fi

          if [ "$need_tiles" = true ]; then echo "tiles=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$need_places" = true ]; then echo "places=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$need_relief" = true ]; then echo "relief=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$need_contours" = true ]; then echo "contours=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$need_routing" = true ]; then echo "routing=true" >> "$GITHUB_OUTPUT"; fi
          if [ "$need_osm" = true ]; then echo "osm=true" >> "$GITHUB_OUTPUT"; fi

          cat "$GITHUB_OUTPUT"
          ls -lh app/src/main/assets || true

      - name: Download OSM extract of Georgia (Geofabrik)
        if: steps.need.outputs.osm == 'true'
        env:
          OSM_URL: ${{ github.event.inputs.osm_url }}
        run: |
          mkdir -p data
          python tools/fetch_osm.py data/georgia.osm.pbf
          ls -lh data/georgia.osm.pbf

      - name: Build vector tiles with Planetiler (OpenMapTiles schema)
        if: steps.need.outputs.tiles == 'true'
        run: |
          curl -L --fail --retry 3 -o data/planetiler.jar \
            https://github.com/onthegomap/planetiler/releases/download/${{ steps.planetiler.outputs.version }}/planetiler.jar
          mkdir -p app/src/main/assets
          java -Xmx4g -jar data/planetiler.jar \
            --osm-path=data/georgia.osm.pbf \
            --download \
            --output=app/src/main/assets/georgia.mbtiles \
            --force \
            --maxzoom=14
          ls -lh app/src/main/assets/georgia.mbtiles

      - name: Normalize MBTiles and verify tile content (layers, ka/ru/en names)
        if: steps.need.outputs.tiles == 'true'
        working-directory: tools
        run: |
          python finalize_tiles.py ../app/src/main/assets/georgia.mbtiles
          python check_tiles.py ../app/src/main/assets/georgia.mbtiles

      - name: Build offline search index
        if: steps.need.outputs.places == 'true'
        working-directory: tools
        run: python build_places.py ../app/src/main/assets/georgia.mbtiles ../app/src/main/assets/places.db

      # Road graph for the offline navigator (car / foot / bike). Optional: without it the app simply has no routing.
      - name: Build road graph for the navigator
        if: steps.need.outputs.routing == 'true'
        continue-on-error: true
        run: |
          rm -f app/src/main/assets/routing.bin
          python -m pip install --quiet osmium numpy
          python tools/build_routing.py data/georgia.osm.pbf app/src/main/assets/routing.bin
          ls -lh app/src/main/assets/routing.bin

      - name: Build relief tiles (hillshade + elevation readout)
        if: steps.need.outputs.relief == 'true'
        continue-on-error: true
        working-directory: tools
        run: |
          rm -f ../app/src/main/assets/relief.mbtiles
          python build_relief.py ../app/src/main/assets/relief.mbtiles

      # Elevation lines (горизонтали) for the "Высоты" layer. Heights come from relief.mbtiles (z<=11) and a one-time
      # download of the z12 terrain tiles; only tiles that exist in georgia.mbtiles are built. Optional: without the
      # file the app simply has no contour lines (peak marks still work).
      - name: Build contour lines
        if: steps.need.outputs.contours == 'true'
        continue-on-error: true
        working-directory: tools
        run: |
          rm -f ../app/src/main/assets/contours.mbtiles
          python -m pip install --quiet numpy scipy pillow contourpy
          python build_contours.py ../app/src/main/assets/contours.mbtiles \
            --relief ../app/src/main/assets/relief.mbtiles \
            --like ../app/src/main/assets/georgia.mbtiles \
            --cache "$RUNNER_TEMP/dem-cache.sqlite"
          ls -lh ../app/src/main/assets/contours.mbtiles

      - name: Validate generated assets before packaging
        run: |
          python tools/check_tiles.py app/src/main/assets/georgia.mbtiles
          python tools/check_cached_assets.py places app/src/main/assets/places.db
          for kind in relief contours routing; do
            case "$kind" in
              relief) path=app/src/main/assets/relief.mbtiles ;;
              contours) path=app/src/main/assets/contours.mbtiles ;;
              routing) path=app/src/main/assets/routing.bin ;;
            esac
            if [ -s "$path" ] && ! python tools/check_cached_assets.py "$kind" "$path"; then
              echo "::warning::$kind asset failed validation and will be omitted from this APK"
              rm -f "$path"
            fi
          done

      - name: Build label fonts (Latin + Cyrillic + Georgian)
        run: |
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq fonts-noto-core fonts-dejavu-core || true
          python -m pip install --quiet pillow numpy scipy fonttools
          rm -rf app/src/main/assets/glyphs
          python tools/build_glyphs.py app/src/main/assets/glyphs/NotoSans

      - name: Generate map styles (7 colour themes x light/dark)
        run: |
          rm -f app/src/main/assets/style*.json
          for P in ocean forest dusk lavender graphite contrast neon; do
            python tools/gen_style.py app/src/main/assets/style_$P.json --palette=$P
            python tools/gen_style.py app/src/main/assets/style_${P}_dark.json --dark --palette=$P
          done

      - name: Write per-asset content manifest
        run: |
          cd app/src/main/assets
          : > map-data-manifest.txt
          for name in georgia.mbtiles places.db relief.mbtiles contours.mbtiles routing.bin; do
            if [ -s "$name" ]; then
              hash=$(sha256sum "$name" | cut -d' ' -f1)
              printf "%s=%s\n" "$name" "$hash" >> map-data-manifest.txt
            fi
          done

      - name: Compute bundled map data version
        id: data
        env:
          OSM_FINGERPRINT: ${{ steps.source.outputs.osm_fingerprint }}
          PLANETILER_VERSION: ${{ steps.planetiler.outputs.version }}
          DATA_TOOLS: ${{ hashFiles('tools/osm_data_revision.txt', 'tools/terrain_data_revision.txt', 'tools/fetch_osm.py', 'tools/finalize_tiles.py', 'tools/mvt.py', 'tools/build_places.py', 'tools/build_routing.py', 'tools/build_relief.py', 'tools/build_contours.py') }}
        run: |
          echo "version=${PLANETILER_VERSION}-${OSM_FINGERPRINT}-${DATA_TOOLS}" >> "$GITHUB_OUTPUT"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare synthetic routing graph for regression tests
        run: |
          python -m pip install --quiet osmium numpy
          python tools/tests/make_test_osm.py "$RUNNER_TEMP/router-test.osm"
          python tools/build_routing.py "$RUNNER_TEMP/router-test.osm" "$RUNNER_TEMP/router-test.bin"
          echo "ROUTER_TEST_GRAPH=$RUNNER_TEMP/router-test.bin" >> "$GITHUB_ENV"

      - name: Run unit tests
        run: gradle --no-daemon -ProuterTestGraph="$ROUTER_TEST_GRAPH" :app:testDebugUnitTest

      - name: Build APK
        run: gradle --no-daemon -Pvcode=${{ github.run_number }} -PmapDataVersion=${{ steps.data.outputs.version }} :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: georgia-offline-map-apk
          path: app/build/outputs/apk/debug/*.apk
          compression-level: 0
